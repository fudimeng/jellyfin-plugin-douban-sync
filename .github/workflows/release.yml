name: Release Jellyfin plugin

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Read and validate version
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use vX.Y.Z format." >&2
            exit 2
          fi
          notes_path=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [[ ! -s "$notes_path" ]]; then
            echo "Release notes not found or empty: $notes_path" >&2
            exit 2
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "notes_path=$notes_path" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore DoubanSync.sln

      - name: Run tests
        run: dotnet test DoubanSync.sln --configuration Release --no-restore

      - name: Build release package
        run: >-
          dotnet msbuild package.proj
          -t:Package
          -p:PackageVersion=${{ steps.release.outputs.version }}
          -p:PluginVersion=${{ steps.release.outputs.version }}.0

      - name: Generate Jellyfin repository manifest
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          packages=(artifacts/douban-sync_${{ steps.release.outputs.version }}_jellyfin-*.zip)
          [[ ${#packages[@]} -eq 1 ]]
          zip_path="${packages[0]}"
          previous_tag=$(gh release view --json tagName --jq .tagName)
          gh release download "$previous_tag" --pattern manifest.json --output artifacts/previous-manifest.json
          bash scripts/generate-release-manifest.sh \
            "${{ steps.release.outputs.version }}" \
            "$GITHUB_REF_NAME" \
            "$GITHUB_REPOSITORY" \
            "$zip_path" \
            "artifacts/manifest.json" \
            "${{ steps.release.outputs.notes_path }}" \
            artifacts/previous-manifest.json
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"
          unzip -t "$zip_path"
          jq empty artifacts/manifest.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          ZIP_PATH: ${{ steps.manifest.outputs.zip_path }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$ZIP_PATH" \
            "artifacts/manifest.json" \
            --notes-file "${{ steps.release.outputs.notes_path }}" \
            --title "Douban Sync ${VERSION}" \
            --verify-tag
